name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 主管线：与本地同一个 verify 脚本（lint / typecheck / test / build / demo typecheck）
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pnpm 版本自动读 package.json 的 packageManager 字段
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

  # peer 兼容矩阵：消费者（demo）在 react 18 / 19 下都能 typecheck + build
  react-matrix:
    name: demo @ react ${{ matrix.react }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        react: ["18", "19"]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # demo 消费 dist：先构建包（全新 checkout 没有 dist）
      - run: pnpm build
      # demo（宿主侧）换装目标 react 版本
      - run: >-
          pnpm --filter @scholar-space/pdf-viewer-demo add
          react@^${{ matrix.react }} react-dom@^${{ matrix.react }}
          @types/react@^${{ matrix.react }} @types/react-dom@^${{ matrix.react }}
      - run: pnpm --filter @scholar-space/pdf-viewer-demo run typecheck
      - run: pnpm --filter @scholar-space/pdf-viewer-demo run build

  # 发布门禁：包体积 / package.json 规范 / 类型解析
  #
  # 为什么单独一个 job：这些检查需要先 build 出 dist，
  # 且失败原因与代码质量不同（是"发布配置"问题）→ 分开看更清楚。
  publish-checks:
    name: 发布门禁（体积 / publint / attw）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # 包体积上限（防止依赖悄悄变大）
      - run: pnpm size
      # package.json / exports 规范
      - run: pnpm publint
      # 类型在 node10 / node16(CJS/ESM) / bundler 下能否正确解析
      - run: pnpm attw

  # E2E：真浏览器验证（渲染 / 文本层 / 面板 / 链接）
  e2e:
    name: E2E（Chromium）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # 装 Chromium（Playwright）
      - run: pnpm exec playwright install --with-deps chromium
      # 起 demo（后台）
      - run: pnpm --filter @scholar-space/pdf-viewer-demo dev --port 5180 &
      - name: 等待 demo 就绪
        run: >-
          node -e "const t=Date.now();(async()=>{while(Date.now()-t<60000){try{const r=await fetch('http://localhost:5180');if(r.ok){console.log('ready');process.exit(0)}}catch{}await new Promise(r=>setTimeout(r,500))}console.error('timeout');process.exit(1)})()"
      - run: node scripts/e2e-smoke.mjs
      - run: node scripts/e2e-text-layer.mjs
      - run: node scripts/e2e-panels.mjs
      - run: node scripts/e2e-links.mjs
      - name: 上传截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: e2e-shots/
          if-no-files-found: ignore
